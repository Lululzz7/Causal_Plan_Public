<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Repository module map</title>
  <desc id="desc">A module map showing how evaluation, generation, filtering, causal trace generation, SFT training, and RL training fit together.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <style>
      .head { font: 700 30px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #f8fafc; }
      .sub { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #cbd5e1; }
      .name { font: 700 17px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
      .body { font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #475569; }
      .pill { fill: #ffffff; rx: 18; }
      .tag { font: 700 11px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #ffffff; letter-spacing: .06em; }
    </style>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="70" y="58" class="head">Module Map</text>
  <text x="70" y="86" class="sub">Each module can be used independently, while sharing the same task-oriented causal-planning conventions.</text>

  <g transform="translate(70 130)">
    <rect width="300" height="92" class="pill"/>
    <rect x="22" y="20" width="76" height="24" rx="12" fill="#2563eb"/>
    <text x="60" y="36" text-anchor="middle" class="tag">EVAL</text>
    <text x="116" y="38" class="name">evaluation</text>
    <text x="22" y="66" class="body">MCQ metrics and open-QA rubric judging.</text>
  </g>

  <g transform="translate(450 130)">
    <rect width="300" height="92" class="pill"/>
    <rect x="22" y="20" width="92" height="24" rx="12" fill="#16a34a"/>
    <text x="68" y="36" text-anchor="middle" class="tag">GEN</text>
    <text x="132" y="38" class="name">four_stage_generation</text>
    <text x="22" y="66" class="body">Plans, localization, keyframes, atomic actions.</text>
  </g>

  <g transform="translate(830 130)">
    <rect width="300" height="92" class="pill"/>
    <rect x="22" y="20" width="70" height="24" rx="12" fill="#ea580c"/>
    <text x="57" y="36" text-anchor="middle" class="tag">QA</text>
    <text x="110" y="38" class="name">qa_generation</text>
    <text x="22" y="66" class="body">20-task prompt registry and QA runners.</text>
  </g>

  <g transform="translate(70 270)">
    <rect width="300" height="92" class="pill"/>
    <rect x="22" y="20" width="78" height="24" rx="12" fill="#9333ea"/>
    <text x="61" y="36" text-anchor="middle" class="tag">FILTER</text>
    <text x="118" y="38" class="name">qa_filtering</text>
    <text x="22" y="66" class="body">Visual grounding, logic, and physical audits.</text>
  </g>

  <g transform="translate(450 270)">
    <rect width="300" height="92" class="pill"/>
    <rect x="22" y="20" width="80" height="24" rx="12" fill="#0891b2"/>
    <text x="62" y="36" text-anchor="middle" class="tag">TRACE</text>
    <text x="120" y="38" class="name">causal_trace_generation</text>
    <text x="22" y="66" class="body">Task-specific causal reasoning traces.</text>
  </g>

  <g transform="translate(830 270)">
    <rect width="300" height="92" class="pill"/>
    <rect x="22" y="20" width="96" height="24" rx="12" fill="#475569"/>
    <text x="70" y="36" text-anchor="middle" class="tag">TRAIN</text>
    <text x="136" y="38" class="name">sft_training / rl_training</text>
    <text x="22" y="66" class="body">SWIFT SFT conversion and reward scoring.</text>
  </g>
</svg>
